name: Promote PlexonTools 4.1.1 Stable

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-4.1.1-stable.yml'

permissions:
  contents: write

concurrency:
  group: plexontools-4.1.1-stable-promotion
  cancel-in-progress: false

jobs:
  stable-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Provision PlexonCore 1.0.0 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-1.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar"
          echo "4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Test and build stable 4.1.1
        run: gradle clean check build --stacktrace

      - name: Verify stable artifact
        shell: bash
        run: |
          set -euo pipefail
          jar_path='build/libs/PlexonTools-4.1.1.jar'
          test -s "${jar_path}"
          jar tf "${jar_path}" > build/jar-contents.txt
          grep -qx 'plugin.yml' build/jar-contents.txt
          grep -qx 'com/plexon/tools/PlexonTools.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/api/PlexonToolsAPI.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/event/PlexonToolProgressEvent.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/event/PlexonToolLevelUpEvent.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/diagnostic/MiningPipelineProfiler.class' build/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' build/jar-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' build/jar-contents.txt; then
            echo 'PlexonCore runtime classes must not be shaded into PlexonTools' >&2
            exit 1
          fi
          unzip -p "${jar_path}" plugin.yml | sed -n 's/^version:[[:space:]]*//p' \
            | head -n 1 | tr -d " '\"\r" | grep -qx '4.1.1'
          javap -verbose -classpath "${jar_path}" com.plexon.tools.PlexonTools \
            | grep -q 'major version: 69'
          cd build/libs
          sha256sum PlexonTools-4.1.1.jar > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish stable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v4.1.1'
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Stable release ${tag} already exists; leaving it unchanged."
            exit 0
          fi
          notes=$(mktemp)
          cat > "${notes}" <<'NOTES'
          ## PlexonTools 4.1.1 — Performance & Stability

          Stable promotion of the validated Preview 3 pipeline.

          ### Runtime performance
          - Reuses validated active-tool context on ordinary single-block mining instead of repeatedly parsing the same item identity.
          - Keeps authoritative progression state in memory and coalesces persistence writes instead of synchronously writing SQLite from the mining event.
          - Batches high-frequency public progress notifications while preserving exact accepted progress totals.
          - Coalesces visual item/lore/action-bar refresh work instead of rebuilding the held tool every block.
          - Avoids duplicate natural-block provenance consumption for the same successful break.
          - Reuses derived Auto Smelt, Magnet, EXP Booster and Area Mine flags on the steady-state mining path.

          ### Diagnostics retained
          - Includes the disabled-by-default internal mining profiler from Preview 3.
          - `/pt perf` can report average, max, P50, P95 and P99 stage timings and operation counters when explicitly enabled by an administrator.
          - Temporary diagnostic isolation controls reset on stop, reload and restart.

          ### Compatibility
          - Paper 26.2 / Java 25.
          - PlexonCore 1.x integration and standalone fallback remain supported.
          - Public PlexonTools progression and level-up events remain available.
          - Existing SQLite data and `plugins/PlexonTools/` configuration are preserved on upgrade.
          NOTES
          gh release create "${tag}" \
            build/libs/PlexonTools-4.1.1.jar \
            build/libs/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title 'PlexonTools 4.1.1 — Performance & Stability' \
            --notes-file "${notes}" \
            --latest
