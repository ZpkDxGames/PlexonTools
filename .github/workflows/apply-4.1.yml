name: Apply PlexonTools 4.1 Migration

on:
  push:
    branches:
      - release/4.1.0
    paths:
      - '.github/workflows/apply-4.1.yml'
      - '.migration/**'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          ref: release/4.1.0
          fetch-depth: 0

      - name: Verify staged migration payload
        shell: bash
        run: |
          set -euo pipefail
          sha256sum .migration/patchpart-*.txt
          test "$(wc -c < .migration/patchpart-00-00.txt)" -eq 2500
          test "$(wc -c < .migration/patchpart-00-01.txt)" -eq 2500
          test "$(wc -c < .migration/patchpart-00-02.txt)" -eq 2500
          test "$(wc -c < .migration/patchpart-01.txt)" -eq 7500
          test "$(wc -c < .migration/patchpart-02.txt)" -eq 7500
          test "$(wc -c < .migration/patchpart-03.txt)" -eq 6840
          echo '8335045b35ca779c6cebea27ed7fdc22ac83831008468097a5dd8e48add9667d  .migration/patchpart-00-00.txt' | sha256sum --check
          echo '9bc0688853ec8ea4735f00d983f3af4bc9d42748aabc7ae8e1311804f6540fcd  .migration/patchpart-00-01.txt' | sha256sum --check
          echo '35646181b2a6f5023e7df8b34c464fb36a6df807e765924ee833355894ddcfd5  .migration/patchpart-00-02.txt' | sha256sum --check
          echo 'b2c46f9608af877a11b3da9b44f694a30cc1a443e39a1428162bfce28de24eeb  .migration/patchpart-01.txt' | sha256sum --check
          echo 'c530bb950b93ac5e5771e46b26edc8d44c86f1282f5e3d61237dd9728a4c9cca  .migration/patchpart-02.txt' | sha256sum --check
          echo '4867d72450789feb0cc5093b12b2ade3eefe2b4111ac49ba016c66be9f7cb060  .migration/patchpart-03.txt' | sha256sum --check

      - name: Reassemble and apply 4.1 delta
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/patchpart-*.txt | base64 --decode | gzip -dc > /tmp/plexontools-4.1.patch
          git apply --check /tmp/plexontools-4.1.patch
          git apply /tmp/plexontools-4.1.patch
          # Java 25 requires Gradle 9.1.0 or newer. Persist this correction into the release source.
          sed -i "s/gradle-version: '8.14.3'/gradle-version: '9.1.0'/g" .github/workflows/build.yml .github/workflows/release.yml
          # Gradle 9 requires the JUnit Platform launcher explicitly on the test runtime classpath.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('build.gradle.kts')
          text = path.read_text()
          needle = '    testImplementation("org.junit.jupiter:junit-jupiter")\n'
          addition = '    testRuntimeOnly("org.junit.platform:junit-platform-launcher")\n'
          if addition not in text:
              if needle not in text:
                  raise SystemExit('Could not locate JUnit Jupiter dependency for launcher insertion')
              text = text.replace(needle, needle + addition, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Verify migration contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'version = "4.1.0"' build.gradle.kts
          grep -q 'JavaLanguageVersion.of(25)' build.gradle.kts
          grep -q 'paper-api:26.2' build.gradle.kts
          grep -q 'PlexonCore:1.0.0' build.gradle.kts
          grep -q 'junit-platform-launcher' build.gradle.kts
          grep -q 'PlexonCore' src/main/resources/plugin.yml
          grep -q "gradle-version: '9.1.0'" .github/workflows/build.yml
          grep -q "gradle-version: '9.1.0'" .github/workflows/release.yml
          test -f src/main/java/com/plexon/tools/api/PlexonToolsAPI.java
          test -f src/main/java/com/plexon/tools/event/PlexonToolProgressEvent.java
          test -f src/main/java/com/plexon/tools/event/PlexonToolLevelUpEvent.java
          test -f src/main/java/com/plexon/tools/integration/core/PlexonCoreBridge.java

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Provision PlexonCore 1.0.0 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-1.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            'https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar'
          echo "4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Test and build migrated plugin
        run: gradle clean check build --stacktrace

      - name: Verify migrated JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_path='build/libs/PlexonTools-4.1.0.jar'
          test -s "${jar_path}"
          jar tf "${jar_path}" > build/jar-contents.txt
          grep -qx 'com/plexon/tools/api/PlexonToolsAPI.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/event/PlexonToolProgressEvent.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/event/PlexonToolLevelUpEvent.class' build/jar-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' build/jar-contents.txt; then
            echo 'PlexonCore runtime classes must not be shaded into PlexonTools' >&2
            exit 1
          fi
          javap -verbose -classpath "${jar_path}" com.plexon.tools.PlexonTools | grep -q 'major version: 69'

      - name: Commit verified 4.1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tonim'
          git config user.email '99552287+ZpkDxGames@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**' ':(exclude).migration/**'
          git diff --cached --check
          git commit -m 'feat: migrate PlexonTools 4.1.0 to PlexonCore'
          git push origin HEAD:release/4.1.0
