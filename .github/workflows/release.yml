name: Release

on:
  push:
    branches: ['release/stable']

permissions:
  contents: write

env:
  ACCEPTED_RC3_SHA: 'a88dcc102b4999184864458b3b72a8c631e74c9a'
  ROLLBACK_TAG: v4.2.1
  ROLLBACK_SHA: 6e7a285fba8c16fc647ccc22c2c8342b2eb96711

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact stable candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.1.0'
      - name: Provision exact PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Read project version
        shell: bash
        run: |
          set -euo pipefail
          version="$(gradle -q properties | sed -n 's/^version: //p')"
          test -n "$version"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Verify exact stable boundary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VERSION" in *-*) echo "Prerelease version cannot use stable publisher: $VERSION" >&2; exit 1;; esac
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$main_sha"
          test "$GITHUB_SHA" = "$main_sha"
          git merge-base --is-ancestor "$ACCEPTED_RC3_SHA" HEAD
          test -f ".release/RELEASE_NOTES_${VERSION}.md"
          test -z "$(git ls-remote --tags origin "refs/tags/v${VERSION}")"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists" >&2
            exit 1
          fi
      - name: Test, check, Javadocs and build exact source
        run: gradle clean check javadoc build --stacktrace
      - name: Build exact release evidence
        shell: bash
        run: |
          set -euo pipefail
          jar_path="build/libs/PlexonTools-${VERSION}.jar"
          test -s "$jar_path"
          jar tf "$jar_path" > build/jar-contents.txt
          for entry in \
            plugin.yml \
            com/plexon/tools/PlexonTools.class \
            com/plexon/tools/api/PlexonToolsAPI.class \
            com/plexon/tools/event/PlexonToolProgressEvent.class \
            com/plexon/tools/event/PlexonToolLevelUpEvent.class \
            org/sqlite/JDBC.class \
            org/sqlite/native/Linux/x86_64/libsqlitejdbc.so \
            org/sqlite/native/Mac/x86_64/libsqlitejdbc.dylib \
            org/sqlite/native/Windows/x86_64/sqlitejdbc.dll; do
            grep -qx "$entry" build/jar-contents.txt
          done
          for prefix in \
            'com/zpkdxgames/plexoncore/' \
            'org/bukkit/' \
            'io/papermc/' \
            'net/kyori/adventure/' \
            'me/clip/placeholderapi/' \
            'com/sk89q/worldguard/' \
            'com/fastasyncworldedit/' \
            'com/boydti/fawe/'; do
            if grep -q "^${prefix}" build/jar-contents.txt; then
              echo "Provided/runtime dependency must not be shaded into PlexonTools: ${prefix}" >&2
              exit 1
            fi
          done
          unzip -p "$jar_path" plugin.yml | sed -n 's/^version:[[:space:]]*//p' \
            | head -n 1 | tr -d " '\"\r" | grep -qx "$VERSION"
          javap -verbose -classpath "$jar_path" com.plexon.tools.PlexonTools | grep -q 'major version: 69'
          python3 - <<'PY'
          import glob, os, pathlib, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('build/test-results/test/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          if not totals['tests'] or totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit(str(totals))
          version = os.environ['VERSION']
          pathlib.Path('build/libs/TEST_SUMMARY.txt').write_text(
              f"PlexonTools {version} stable release test summary\n"
              f"tests={totals['tests']}\nfailures={totals['failures']}\n"
              f"errors={totals['errors']}\nskipped={totals['skipped']}\n"
              "distribution=PASS\njava_major=69\nruntime_certification=NOT_EXECUTED\n",
              encoding='utf-8')
          PY
          (cd build/libs && sha256sum "PlexonTools-${VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          size=$(stat -c%s "$jar_path"); digest=$(sha256sum "$jar_path" | awk '{print $1}')
          cat > build/libs/PROVENANCE.txt <<EOF
          product=PlexonTools
          version=${VERSION}
          commit=${GITHUB_SHA}
          tag=v${VERSION}
          accepted_rc3=${ACCEPTED_RC3_SHA}
          rollback_tag=${ROLLBACK_TAG}
          rollback_commit=${ROLLBACK_SHA}
          plexoncore=2.0.4
          gameplay_authority=LOCAL
          provenance_authority=LOCAL
          area_mine=DISABLED_SAFE
          jar_size=${size}
          jar_sha256=${digest}
          runtime_certification=NOT_EXECUTED
          EOF
      - name: Publish GitHub stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            "build/libs/PlexonTools-${VERSION}.jar" \
            build/libs/SHA256SUMS.txt \
            build/libs/TEST_SUMMARY.txt \
            build/libs/PROVENANCE.txt \
            --target "$GITHUB_SHA" \
            --title "PlexonTools ${VERSION}" \
            --notes-file ".release/RELEASE_NOTES_${VERSION}.md" \
            --latest
      - name: Verify published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "v${VERSION}" --json isPrerelease --jq '.isPrerelease')" = false
          test "$(gh release view "v${VERSION}" --json tagName --jq '.tagName')" = "v${VERSION}"
          test "$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)" = "$GITHUB_SHA"
          assets="$(gh release view "v${VERSION}" --json assets --jq '.assets[].name')"
          for asset in "PlexonTools-${VERSION}.jar" SHA256SUMS.txt TEST_SUMMARY.txt PROVENANCE.txt; do
            grep -qx "$asset" <<<"$assets"
          done
          mkdir published
          gh release download "v${VERSION}" --dir published
          (cd published && sha256sum --check SHA256SUMS.txt)
          grep -F "commit=${GITHUB_SHA}" published/PROVENANCE.txt
          grep -F 'area_mine=DISABLED_SAFE' published/PROVENANCE.txt
          grep -F 'runtime_certification=NOT_EXECUTED' published/PROVENANCE.txt
      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: PlexonTools-release-${{ github.sha }}
          path: |
            build/libs/PlexonTools-*.jar
            build/libs/SHA256SUMS.txt
            build/libs/TEST_SUMMARY.txt
            build/libs/PROVENANCE.txt
          if-no-files-found: warn
          retention-days: 30
