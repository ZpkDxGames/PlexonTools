name: Release PlexonTools 4.2.0

on:
  push:
    branches:
      - 'release-trigger/4.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require exact release trigger
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'release-trigger/4.2.0'

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Provision PlexonCore 1.0.0 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-1.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar"
          echo "4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Test and build exact release commit
        run: gradle clean check build --stacktrace

      - name: Verify release JAR and checksum
        shell: bash
        run: |
          set -euo pipefail
          jar_path='build/libs/PlexonTools-4.2.0.jar'
          test -s "${jar_path}"
          jar tf "${jar_path}" > build/jar-contents.txt
          grep -qx 'plugin.yml' build/jar-contents.txt
          grep -qx 'com/plexon/tools/api/PlexonToolsAPI.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/event/PlexonToolProgressEvent.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/event/PlexonToolLevelUpEvent.class' build/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' build/jar-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' build/jar-contents.txt; then
            echo 'PlexonCore runtime classes must not be shaded into PlexonTools' >&2
            exit 1
          fi
          unzip -p "${jar_path}" plugin.yml | sed -n 's/^version:[[:space:]]*//p' \
            | head -n 1 | tr -d " '\"\r" | grep -qx '4.2.0'
          javap -verbose -classpath "${jar_path}" com.plexon.tools.PlexonTools \
            | grep -q 'major version: 69'
          cd build/libs
          sha256sum PlexonTools-4.2.0.jar > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag='v4.2.0'
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists; refusing to replace it." >&2
            exit 1
          fi
          notes=$(mktemp)
          cat > "${notes}" <<'NOTES'
          ## PlexonTools 4.2.0 — Performance & Reliability

          PlexonTools 4.2.0 extends the 4.1.1 mining optimizations with bounded Area Mine execution, event-driven passive-effect reconciliation, safer BlockBreak/BlockDrop correlation, stronger natural-provenance batching, transactional settings reloads, and deeper persistence/runtime diagnostics.

          ### Performance & reliability
          - Reduces ordinary mining hot-path work and skips progression/provenance work for terminal tools while preserving abilities.
          - Replaces passive whole-server scans with relevant-holder tracking and cached potion-effect resolution.
          - Correlates pending drop contexts by player and exact block position with hard bounds and lifecycle cleanup.
          - Adds a bounded `BulkBreakCoordinator` for Area Mine with strict event compatibility, activation caps, per-player/tick budgets, and deduplication.
          - Adds provenance batch primitives and bulk persistence enqueue support.
          - Adds persistence queue high-water, mutation, batch, commit, pressure-flush, failure, and snapshot diagnostics.
          - Makes settings reload candidate-based so malformed late configuration cannot partially mutate the live runtime.

          ### Compatibility
          - Public `PlexonToolsAPI`, `PlexonToolProgressEvent`, and `PlexonToolLevelUpEvent` contracts are preserved.
          - SQLite schema and existing player/tool data remain compatible; no reset is required.
          - Ownership, world binding, natural-block progression, cancellation/protection semantics, and PlexonCore 1.x integration remain authoritative.
          - Area Mine defaults to compatibility-safe `STRICT_EVENTS`; requested optimized mode fails safe until protection-safe hooks are available.
          - Paper 26.2 / Java 25.

          ### Verification
          - Java 25 Gradle tests and packaging run against the exact merged release commit.
          - JAR contents, public API/event classes, SQLite runtime/native entries, Java 25 bytecode, and SHA-256 are verified before publication.

          Keep the existing `plugins/PlexonTools/` directory when upgrading. Replace only the plugin JAR after backing up the existing installation.
          NOTES
          gh release create "${release_tag}" \
            build/libs/PlexonTools-4.2.0.jar \
            build/libs/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title 'PlexonTools 4.2.0 — Performance & Reliability' \
            --notes-file "${notes}" \
            --latest
