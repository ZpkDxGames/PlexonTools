name: Release PlexonTools 4.3.0 RC1

on:
  push:
    branches:
      - 'release-trigger/4.3.0-rc.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release candidate source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require exact release trigger
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'release-trigger/4.3.0-rc.1'

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Provision exact PlexonCore 2.0.0 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.0/PlexonCore-2.0.0.jar"
          echo "179b82ce7fd82e3095b3a6d0d893af6d7c97f91bd7ce403e96d7f3581462dfec  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=2.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Test and build exact candidate commit
        run: gradle clean check build --stacktrace

      - name: Verify release JAR and checksum
        shell: bash
        run: |
          set -euo pipefail
          jar_path='build/libs/PlexonTools-4.3.0.jar'
          test -s "${jar_path}"
          jar tf "${jar_path}" > build/jar-contents.txt
          grep -qx 'plugin.yml' build/jar-contents.txt
          grep -qx 'com/plexon/tools/PlexonTools.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/api/PlexonToolsAPI.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/event/PlexonToolProgressEvent.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/event/PlexonToolLevelUpEvent.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/integration/core/PlexonCoreBridge.class' build/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' build/jar-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' build/jar-contents.txt; then
            echo 'PlexonCore runtime classes must not be shaded into PlexonTools' >&2
            exit 1
          fi
          unzip -p "${jar_path}" plugin.yml | sed -n 's/^version:[[:space:]]*//p' \
            | head -n 1 | tr -d " '\"\r" | grep -qx '4.3.0'
          javap -verbose -classpath "${jar_path}" com.plexon.tools.PlexonTools \
            | grep -q 'major version: 69'
          cd build/libs
          sha256sum PlexonTools-4.3.0.jar > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag='v4.3.0-rc.1'
          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${release_tag} already exists; refusing to replace it." >&2
            exit 1
          fi
          notes=$(mktemp)
          cat > "${notes}" <<'NOTES'
          ## PlexonTools 4.3.0 RC1 — PlexonCore 2 migration gate

          This is a release candidate for the PlexonCore 2 runtime migration. It is intentionally **not** the stable v4.3.0 release.

          ### Included
          - Builds PlexonTools 4.3.0 against the exact released PlexonCore 2.0.0 API artifact.
          - Registers the Tools module using the actual Core API 2 compatibility contract while retaining safe Core 1 compatibility discovery where available.
          - Preserves standalone classloading, existing player/tool data, public API/events, SQLite ownership and the optimized 4.2 mining/progression pipeline.
          - Refuses to report CORE_RUNTIME authority until the runtime/cancellation/origin/performance gates are validated.

          ### Stable-release blockers discovered against released Core 2.0.0
          - The Core block gateway acquires at HIGHEST while the existing PlexonTools mutable EXP phase is HIGH, so the current Core context cannot safely replace that acquisition phase without a Core/runtime contract adjustment.
          - Core 2 origin tracking does not yet reproduce PlexonTools falling-block provenance and has no import path for the existing PlexonTools placed-block database; switching Core origin authority now could regress anti-exploit behavior on upgraded worlds.
          - Core namespace identity currently performs ItemMeta/PDC inspection on every routed break; performance parity with the 4.2 active-context cache has not yet been demonstrated.

          Use this artifact only for compatibility/build validation. Keep PlexonTools 4.2.0 as the production rollback artifact until the required runtime and Spark gates pass.
          NOTES
          gh release create "${release_tag}" \
            build/libs/PlexonTools-4.3.0.jar \
            build/libs/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title 'PlexonTools 4.3.0 RC1 — PlexonCore 2 Migration Gate' \
            --notes-file "${notes}" \
            --prerelease
