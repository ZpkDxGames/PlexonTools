name: Release PlexonTools 4.1.1

on:
  push:
    tags:
      - 'v4.1.1'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require exact release tag
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'v4.1.1'

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Provision PlexonCore 1.0.0 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-1.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v1.0.0/PlexonCore-1.0.0.jar"
          echo "4abce6de93293e21b31cb874734430d5bdc77de17a4c3b98fd6a9006e1f13018  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=1.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Test and build exact tag
        run: gradle clean check build --stacktrace

      - name: Verify release JAR and checksum
        shell: bash
        run: |
          set -euo pipefail
          jar_path='build/libs/PlexonTools-4.1.1.jar'
          test -s "${jar_path}"
          jar tf "${jar_path}" > build/jar-contents.txt
          grep -qx 'plugin.yml' build/jar-contents.txt
          grep -qx 'com/plexon/tools/api/PlexonToolsAPI.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/event/PlexonToolProgressEvent.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/event/PlexonToolLevelUpEvent.class' build/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' build/jar-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' build/jar-contents.txt; then
            echo 'PlexonCore runtime classes must not be shaded into PlexonTools' >&2
            exit 1
          fi
          unzip -p "${jar_path}" plugin.yml | sed -n 's/^version:[[:space:]]*//p' \
            | head -n 1 | tr -d " '\"\r" | grep -qx '4.1.1'
          javap -verbose -classpath "${jar_path}" com.plexon.tools.PlexonTools \
            | grep -q 'major version: 69'
          cd build/libs
          sha256sum PlexonTools-4.1.1.jar > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(mktemp)
          cat > "${notes}" <<'NOTES'
          ## PlexonTools 4.1.1 — Performance & Stability

          PlexonTools 4.1.1 focuses on the ordinary single-block mining hot path used by progressive legendary tools.

          ### Performance
          - Coalesces high-frequency public tool-progress notifications over a short server-tick window while preserving exact total amounts.
          - Reuses authoritative in-memory tool state instead of reconstructing registry snapshots repeatedly during mining.
          - Reuses the validated block-break tool context for Auto Smelt / Magnet drop handling when applicable.
          - Avoids duplicate natural-block provenance consumption for the same successful tool break.
          - Keeps visual item/lore/action-bar refreshes coalesced rather than rendering per block.

          ### Compatibility
          - Immediate authoritative progression and immediate level-up events are preserved.
          - PlexonCore 1.x integration and standalone fallback are preserved.
          - PlexonQuests-compatible public event classes remain available; a progress event may represent multiple accepted units through its existing `amount` field.
          - SQLite storage format, WAL behavior, and asynchronous runtime persistence remain unchanged.
          - Paper 26.2 / Java 25.

          Keep the existing `plugins/PlexonTools/` directory when upgrading.
          NOTES
          gh release create "${GITHUB_REF_NAME}" \
            build/libs/PlexonTools-4.1.1.jar \
            build/libs/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title 'PlexonTools 4.1.1 — Performance & Stability' \
            --notes-file "${notes}" \
            --latest
