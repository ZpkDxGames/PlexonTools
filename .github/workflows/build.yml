name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Provision PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  ${core_jar}" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Test and package
        run: gradle clean check build --stacktrace
      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          jar_path='build/libs/PlexonTools-4.2.1.jar'
          test -s "${jar_path}"
          jar tf "${jar_path}" > build/jar-contents.txt
          grep -qx 'plugin.yml' build/jar-contents.txt
          grep -qx 'com/plexon/tools/PlexonTools.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/api/PlexonToolsAPI.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/event/PlexonToolProgressEvent.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/event/PlexonToolLevelUpEvent.class' build/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' build/jar-contents.txt
          if grep -q '^com/zpkdxgames/plexoncore/' build/jar-contents.txt; then
            echo 'PlexonCore runtime classes must not be shaded into PlexonTools' >&2
            exit 1
          fi
          unzip -p "${jar_path}" plugin.yml | sed -n 's/^version:[[:space:]]*//p' \
            | head -n 1 | tr -d " '\"\r" | grep -qx '4.2.1'
          javap -verbose -classpath "${jar_path}" com.plexon.tools.PlexonTools | grep -q 'major version: 69'
          (cd build/libs && sha256sum PlexonTools-4.2.1.jar > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
      - name: Check whitespace
        run: git diff --check origin/main...HEAD
      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexonTools-4.2.1-${{ github.sha }}
          path: |
            build/libs/PlexonTools-4.2.1.jar
            build/libs/SHA256SUMS.txt
          if-no-files-found: error
