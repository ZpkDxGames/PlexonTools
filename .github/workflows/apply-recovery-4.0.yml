name: Apply recovered 4.0 baseline

on:
  push:
    branches:
      - 'release/recovery-4.0.0'
    paths:
      - '.github/workflows/apply-recovery-4.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: release/recovery-4.0.0
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode and validate recovered patch
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/patch.part01 .recovery/patch.part02 .recovery/patch.part03 .recovery/patch.part04 .recovery/patch.part05 \
            | base64 --decode | gzip --decompress > /tmp/recovery-4.0.patch
          git apply --check /tmp/recovery-4.0.patch
          git apply /tmp/recovery-4.0.patch
          git diff --check

      - name: Verify production 4.0 default resources
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum src/main/resources/config.yml | awk '{print $1}')" = "ac075e7dea73b34ffb41f974dba20110fe3e1aeb866fadde3bce74ac8caeedb7"
          test "$(sha256sum src/main/resources/tools.yml | awk '{print $1}')" = "72e10e8191fe1510ebcdd5595d2127c864ae6cad9bbc7ba2d7047024dd03c04d"
          cp src/main/resources/tools.yml /tmp/production-tools.yml
          git show HEAD:src/main/resources/tools.yml > src/main/resources/tools.yml
          python3 scripts/generate_default_tools.py
          cmp -s src/main/resources/tools.yml /tmp/production-tools.yml
          test "$(sha256sum src/main/resources/tools.yml | awk '{print $1}')" = "72e10e8191fe1510ebcdd5595d2127c864ae6cad9bbc7ba2d7047024dd03c04d"

      - name: Run recovered 4.0 tests and build
        run: gradle clean check build --stacktrace

      - name: Verify recovered release JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonTools-4.0.0.jar"
          test -f "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Eq "^version: ['\"]?4\.0\.0['\"]?$"
          unzip -p "$JAR" config.yml | sha256sum | grep -q '^ac075e7dea73b34ffb41f974dba20110fe3e1aeb866fadde3bce74ac8caeedb7'
          unzip -p "$JAR" tools.yml | sha256sum | grep -q '^72e10e8191fe1510ebcdd5595d2127c864ae6cad9bbc7ba2d7047024dd03c04d'

      - name: Commit recovered maintained baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery
          rm -f .github/workflows/recovery-source-snapshot.yml
          rm -f .github/workflows/apply-recovery-4.0.yml
          git config user.name "Tonim"
          git config user.email "99552287+ZpkDxGames@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "recovery: restore production PlexonTools 4.0.0 baseline"
          git push origin HEAD:release/recovery-4.0.0

      - name: Upload recovered baseline JAR
        uses: actions/upload-artifact@v4
        with:
          name: PlexonTools-4.0.0-recovered
          path: build/libs/PlexonTools-4.0.0.jar
          if-no-files-found: error
