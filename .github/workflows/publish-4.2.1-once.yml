name: Publish PlexonTools 4.2.1 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-4.2.1-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Provision verified PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.4.jar"
          curl --fail --location --silent --show-error --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.4/PlexonCore-2.0.4.jar"
          echo "61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf  $core_jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion=2.0.4 -Dpackaging=jar -DgeneratePom=true
      - name: Build and verify exact merged commit
        run: gradle clean check build --stacktrace
      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          JAR='build/libs/PlexonTools-4.2.1.jar'
          test -s "$JAR"
          jar tf "$JAR" > build/jar-contents.txt
          grep -qx 'plugin.yml' build/jar-contents.txt
          grep -qx 'com/plexon/tools/PlexonTools.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/api/PlexonToolsAPI.class' build/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' build/jar-contents.txt
          unzip -p "$JAR" plugin.yml | sed -n 's/^version:[[:space:]]*//p' | head -n1 | tr -d " '\"\r" | grep -qx '4.2.1'
          if grep -q '^com/zpkdxgames/plexoncore/' build/jar-contents.txt; then exit 1; fi
          (cd build/libs && sha256sum PlexonTools-4.2.1.jar > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
      - name: Publish immutable v4.2.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v4.2.1 >/dev/null 2>&1; then
            echo 'v4.2.1 already exists; refusing to replace immutable release assets.' >&2
            exit 1
          fi
          gh release create v4.2.1 \
            build/libs/PlexonTools-4.2.1.jar \
            build/libs/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title 'PlexonTools 4.2.1 — Core 2.0.4 Local Authority' \
            --notes-file docs/PLEXONTOOLS_4_2_1.md
