name: Phase 3 prerelease 4.3.0-rc.3

on:
  push:
    branches:
      - 'release-trigger/4.3.0-rc.3'

permissions:
  contents: write

env:
  ACCEPTED_SHA: '00864345eab14c372c456d669d5d9f06dd3b9cf1'
  RELEASE_TARGET_SHA: 'a88dcc102b4999184864458b3b72a8c631e74c9a'
  VERSION: '4.3.0-rc.3'
  TAG: 'v4.3.0-rc.3'
  CORE_VERSION: '2.0.4'
  CORE_SHA256: '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'
  PREVIOUS_RC1_SHA: '3144e495c812746c1a94a5d2105a6006e47e72d2'
  PREVIOUS_RC2_SHA: 'f43475cb825f7e52e1a7c7be096df4e7c211dcff'

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify immutable release boundary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'release-trigger/4.3.0-rc.3'
          git merge-base --is-ancestor "${ACCEPTED_SHA}" "${GITHUB_SHA}"
          while IFS= read -r path; do
            case "${path}" in
              build.gradle.kts|.github/workflows/phase3-release-4.3.0-rc.3.yml|.github/workflows/build.yml) ;;
              *) echo "Non-release delta detected: ${path}" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "${ACCEPTED_SHA}..${GITHUB_SHA}")
          python3 - <<'PY'
          import os, subprocess
          base = subprocess.check_output(['git','show',f"{os.environ['ACCEPTED_SHA']}:build.gradle.kts"], text=True)
          current = open('build.gradle.kts', encoding='utf-8').read()
          expected = base.replace('version = "4.3.0-rc.2"', 'version = "4.3.0-rc.3"', 1)
          if current != expected:
              raise SystemExit('build.gradle.kts contains changes beyond version-only release metadata')
          PY
          test "$(git ls-remote --tags origin refs/tags/v4.3.0-rc.1 | cut -f1)" = "${PREVIOUS_RC1_SHA}"
          test "$(git ls-remote --tags origin refs/tags/v4.3.0-rc.2 | cut -f1)" = "${PREVIOUS_RC2_SHA}"
          current_tag="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)"
          if [ -n "${current_tag}" ]; then
            test "${current_tag}" = "${RELEASE_TARGET_SHA}"
            gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Provision pinned PlexonCore 2.0.4 API
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-${CORE_VERSION}.jar"
          curl --fail --location --silent --show-error --retry 3 --output "${core_jar}" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v${CORE_VERSION}/PlexonCore-${CORE_VERSION}.jar"
          echo "${CORE_SHA256}  ${core_jar}" | sha256sum --check --strict
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="${core_jar}" -DgroupId=com.zpkdxgames -DartifactId=PlexonCore \
            -Dversion="${CORE_VERSION}" -Dpackaging=jar -DgeneratePom=true

      - name: Full supported verification
        run: gradle clean test check build --stacktrace

      - name: Verify distribution and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          jar_path="build/libs/PlexonTools-${VERSION}.jar"
          test -s "${jar_path}"
          jar tf "${jar_path}" > build/jar-contents.txt
          grep -qx 'plugin.yml' build/jar-contents.txt
          grep -qx 'com/plexon/tools/PlexonTools.class' build/jar-contents.txt
          grep -qx 'com/plexon/tools/api/PlexonToolsAPI.class' build/jar-contents.txt
          grep -qx 'org/sqlite/JDBC.class' build/jar-contents.txt
          for prefix in 'com/zpkdxgames/plexoncore/' 'org/bukkit/' 'io/papermc/' 'net/kyori/adventure/' 'me/clip/placeholderapi/' 'com/sk89q/worldguard/' 'com/fastasyncworldedit/' 'com/boydti/fawe/'; do
            if grep -q "^${prefix}" build/jar-contents.txt; then
              echo "Provided/runtime dependency must not be shaded into PlexonTools: ${prefix}" >&2
              exit 1
            fi
          done
          unzip -p "${jar_path}" plugin.yml | sed -n 's/^version:[[:space:]]*//p' | head -n 1 | tr -d " '\"\r" | grep -qx "${VERSION}"
          javap -verbose -classpath "${jar_path}" com.plexon.tools.PlexonTools | grep -q 'major version: 69'
          grep -q 'paper-api:26.2.build.121-stable' build.gradle.kts
          grep -q 'PlexonCore:2.0.4' build.gradle.kts
          (cd build/libs && sha256sum "PlexonTools-${VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)

      - name: Generate verification evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('build/test-results/test/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          if totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit(f'Unexpected test accounting: {totals}')
          with open('build/libs/TEST_SUMMARY.txt','w',encoding='utf-8') as out:
              out.write('PlexonTools 4.3.0-rc.3 Phase 3 release verification\n')
              for key in ('tests','failures','errors','skipped'):
                  out.write(f'{key}={totals[key]}\n')
              out.write('java_major=69\npaper_26_2=PASS\nplexoncore_non_shaded=PASS\nserver_api_non_shaded=PASS\nruntime_certification=NOT_EXECUTED\n')
          print(totals)
          PY

      - name: Publish only if immutable RC does not yet exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "${TAG} already exists and will not be modified."
            exit 0
          fi
          test "${GITHUB_SHA}" = "${RELEASE_TARGET_SHA}"
          notes=$(mktemp)
          printf '%s\n' '## PlexonTools 4.3.0-rc.3 — Phase 3 performance candidate' '' 'Prerelease only. Runtime certification was not executed. Stable promotion is not authorized.' > "${notes}"
          gh release create "${TAG}" \
            "build/libs/PlexonTools-${VERSION}.jar" build/libs/SHA256SUMS.txt build/libs/TEST_SUMMARY.txt \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "PlexonTools ${VERSION} — Phase 3 RC" --notes-file "${notes}" --prerelease

      - name: Independently verify immutable published prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > build/published-release.json
          python3 - <<'PY'
          import json, os
          data=json.load(open('build/published-release.json',encoding='utf-8'))
          assert data['prerelease'] is True
          jar=f"PlexonTools-{os.environ['VERSION']}.jar"
          assets={a['name']:a for a in data['assets']}
          assert jar in assets and assets[jar]['size'] > 0
          assert 'SHA256SUMS.txt' in assets
          print(f"release_id={data['id']}")
          print(f"release_url={data['html_url']}")
          print(f"jar_size={assets[jar]['size']}")
          print(f"jar_remote_digest={assets[jar].get('digest','')}")
          print(f"jar_download_url={assets[jar]['browser_download_url']}")
          PY
          test "$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)" = "${RELEASE_TARGET_SHA}"
          test "$(git ls-remote --tags origin refs/tags/v4.3.0-rc.1 | cut -f1)" = "${PREVIOUS_RC1_SHA}"
          test "$(git ls-remote --tags origin refs/tags/v4.3.0-rc.2 | cut -f1)" = "${PREVIOUS_RC2_SHA}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/PlexonTools-${VERSION}.jar"
          curl --fail --location --retry 3 --output build/remote.jar "${url}"
          local_sha=$(cut -d' ' -f1 build/libs/SHA256SUMS.txt)
          remote_sha=$(sha256sum build/remote.jar | cut -d' ' -f1)
          test "${local_sha}" = "${remote_sha}"
          echo "verified_sha256=${remote_sha}"
