messages:
  prefix: "<gradient:#4158D0:#C850C0><bold>PlexonTools</bold></gradient> <dark_gray>»</dark_gray> "

  no-permission: "<red>You do not have permission to do that.</red>"
  players-only: "<red>This command can only be used by a player.</red>"
  player-not-found: "<red>Player <white>{player}</white> is not online.</red>"
  category-not-found: "<red>Unknown tool category <white>{category}</white>.</red>"
  tool-not-found: "<red>Unknown tool <white>{tool}</white>.</red>"
  tool-disabled: "<red>That tool is currently disabled.</red>"
  invalid-world: "<red><white>{tool}</white> cannot be bound to <white>{world}</white>.</red>"
  tool-given: "<green>Granted <white>{tool}</white> to <white>{player}</white>, bound to <white>{world}</white>.</green>"
  tool-received: "<green>You received <white>{tool}</white>, bound to <white>{world}</white>.</green>"
  reload-complete: "<green>Reloaded <white>{count}</white> tools in <white>{time}ms</white>.</green>"
  reload-failed: "<red>Reload failed. The last valid runtime configuration remains active; check the console.</red>"
  world-locked: "<red>⚠ This custom tool cannot be leveled up in world <white>{world}</white>!</red>"
  owner-locked: "<red>This tool belongs to <white>{owner}</white>.</red>"
  invalid-tool-item: "<red>This Plexon tool is invalid or no longer configured.</red>"
  level-up: "<gradient:#FFD54A:#FF8A00><bold>Tool upgraded!</bold></gradient> <white>{tool}</white> <gray>reached level</gray> <yellow>{level}</yellow><gray>.</gray>"
  inventory-full: "<yellow>Your inventory is full. The bound tool was not dropped.</yellow>"
  activation-inventory-full: "<yellow>Your inventory is full. Free one slot to activate the bound tool.</yellow>"
  target-inventory-full: "<yellow><white>{player}</white>'s inventory is full; no tool was issued or dropped.</yellow>"
  activation-unavailable: "<red>That tool cannot be activated in this world.</red>"
  tool-activated: "<green>Activated <white>{tool}</white> for <white>{world}</white>.</green>"
  tool-deactivated: "<yellow>Deactivated and safely stored <white>{tool}</white> for <white>{world}</white>.</yellow>"
  prompt-cancelled: "<gray>Editor input cancelled.</gray>"
  prompt-timeout: "<red>The editor input timed out.</red>"
  editor-saved: "<green>Saved <white>{field}</white> for <white>{tool}</white>.</green>"
  editor-error: "<red>{error}</red>"
  delete-armed: "<yellow>Shift-right-click again within 8 seconds to permanently delete <white>{tool}</white>.</yellow>"
  tool-deleted: "<green>Deleted tool <white>{tool}</white>.</green>"
