# Player-facing /pt world layouts.
#
# World IDs are normalized lowercase keys; the title's {world} placeholder uses
# the live Bukkit world name. Rows are clamped from 3 through 6. Tool slots are
# zero-based inner content slots (borders/navigation are reserved).
# Each world may omit title, rows, or filler fields to inherit `defaults`.
#
# With config.yml world-menu.auto-show-allowed-tools: true, entries under tools
# only pin exact positions. Unlisted allowed tools are placed automatically.
# Set it false when this file should also act as a strict membership list.
defaults:
  title: "<gradient:#FFF176:#FF8F00><bold>Mining Loadout</bold></gradient> <dark_gray>• {world}</dark_gray>"
  rows: 3
  filler:
    material: BLACK_STAINED_GLASS_PANE
    name: ' '
worlds:
  # This key matches the bundled tool's allowed world Survival_World.
  survival_world:
    title: "<gradient:#FFF176:#FF8F00><bold>Mining Loadout</bold></gradient> <dark_gray>• {world}</dark_gray>"
    rows: 3
    filler:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
    tools:
      # Remove this entry to let automatic placement choose a free slot.
      legendary_pickaxe:
        slot: 13
