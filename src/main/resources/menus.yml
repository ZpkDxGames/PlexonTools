# Player-facing /pt menus. Admins can edit these in /pt gui.
# Tool entries are world reservations: only listed tools can be activated there.
defaults:
  title: "<gradient:#4158D0:#C850C0><bold>World Tools</bold></gradient> <dark_gray>• {world}</dark_gray>"
  rows: 4
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "

worlds:
  world:
    title: "<gradient:#41E296:#A8FF78><bold>Survival Tools</bold></gradient>"
    rows: 4
    filler:
      material: BLACK_STAINED_GLASS_PANE
      name: " "
    tools:
      magma_breaker:
        slot: 10
      hunter_blade:
        slot: 11
      harvest_scythe:
        slot: 12
      deepwater_rod:
        slot: 13
      titan_axe:
        slot: 14
      architect_bricks:
        slot: 15

  world_nether:
    title: "<gradient:#FF4500:#FFA500><bold>Nether Tools</bold></gradient>"
    rows: 3
    filler:
      material: RED_STAINED_GLASS_PANE
      name: " "
    tools:
      magma_breaker:
        slot: 13
