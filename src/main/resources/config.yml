# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    PlexonTools 3.6.1 configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
#
# Text supports Adventure MiniMessage:
# https://docs.advntr.dev/minimessage/format.html
# Reload visual/gameplay changes with /pt reload. The storage filename, busy
# timeout, WAL, and integrity options apply at startup and require a restart.

config-version: 1

# Core ownership and protection behavior.
settings:
  # Require WORLD-scoped items to be used in their persisted world as well as
  # an allowed world. PLAYER-scoped items may use every allowed world.
  enforce-bound-world: true
  # Retained for old configuration compatibility. Owner locking is always enforced.
  enforce-owner: true

  # Cancel unauthorized actions instead of merely refusing progression.
  cancel-unauthorized-block-breaks: true
  cancel-unauthorized-interactions: true
  cancel-unauthorized-attacks: true

  # Rate-limit owner/world warnings shown in the action bar.
  unauthorized-warning-cooldown-ms: 1500

# Mutable player and tool-instance state is stored in SQLite. Gameplay events
# only mutate the in-memory cache; the async worker coalesces repeated updates
# for the same tool UUID and writes them in bounded transactions.
storage:
  # Simple filename inside plugins/PlexonTools. Requires a restart to change.
  database-file: "plexontools.db"

  # How often the async worker drains pending records. 20 ticks = about 1 second.
  flush-interval-ticks: 20
  # Maximum records in one SQLite transaction.
  write-batch-size: 256
  # Maximum distinct queued UUIDs before falling back to one safe full snapshot.
  max-pending-writes: 8192

  # SQLite waits this long for another connection before reporting a locked DB.
  # Requires a restart to change.
  busy-timeout-ms: 5000
  # WAL pages between automatic checkpoints. Final shutdown uses TRUNCATE.
  # Requires a restart to change.
  wal-autocheckpoint-pages: 1000
  # Runs integrity and foreign-key checks before mutable state is loaded.
  # Requires a restart to change.
  integrity-check-on-startup: true

# Server-thread work performed after accepted progression events. Authoritative
# level/progress state is updated in memory immediately and remains protected by
# the asynchronous SQLite queue above. Only expensive item lore/PDC rendering
# and progress action-bar packets are coalesced into this short visual window.
performance:
  # 4 ticks = at most five visible refreshes per second per tool instance.
  # Level-ups, quit/death/world transitions, reload, and shutdown flush at once.
  # Use 1 for nearly immediate visuals; higher values reduce metadata/packet work.
  progress-visual-refresh-ticks: 4

# Shared progress bar renderer used by physical tool lore, menu cards, and the
# progress action bar. Width is clamped between 5 and 50 characters.
progress-bar:
  width: 16
  filled-symbol: "■"
  empty-symbol: "■"
  filled-format: "<!italic><gradient:#66BB6A:#AEEA00>"
  empty-format: "<!italic><#263238>"

# The current X value in X/Y moves through this red → amber → green palette.
# The required Y value keeps its fixed color in the templates below.
progress-value-colors:
  start: "#FF5252"
  middle: "#FFD740"
  complete: "#76FF03"

# Default player-facing /pt card and separate ON/OFF panel.
#
# Card material may be TOOL (the saved level's material) or any Bukkit item.
# Card/panel placeholders:
#   {tool} {tool_id} {level} {max_level} {level_name} {material_name}
#   {current} {required} {current_color} {percentage_color}
#   {percentage} {progress_bar} {tracking} {world} {status} {state}
#   {state_symbol} {toggle_action} {toggle_hint} {owner_name}
world-menu:
  # true: allowed_worlds controls visibility and menus.yml only pins slots.
  # false: the tool must also be listed under that world in menus.yml.
  auto-show-allowed-tools: true

  tool-card:
    material: TOOL
    display-name: "{tool}"
    glint-when-active: true
    lore:
      - "<dark_gray>Ancient soulbound relic</dark_gray>"
      - ""
      - "<#FFD740>✥</#FFD740> <gray>Rank</gray> <white>{level_name}</white>"
      - "<#90CAF9>⚒</#90CAF9> <gray>Form</gray> <white>{material_name}</white>"
      - "<#FFB300>◆</#FFB300> <gray>Objective</gray> <white>{tracking}</white>"
      - "<#FFD54F>⚡</#FFD54F> <gray>Progress</gray> <color:{current_color}>{current}</color><dark_gray>/</dark_gray><#B0BEC5>{required}</#B0BEC5>"
      - "<#66BB6A>▰</#66BB6A> <gray>Mastery</gray> <color:{percentage_color}>{percentage}%</color>"
      - ""
      - "<gray>Status</gray> {status}"
      - "{toggle_hint}"

  toggle-panel:
    # When disabled, clicking the main card still toggles the tool.
    enabled: true
    active:
      material: LIME_STAINED_GLASS_PANE
      display-name: "<gradient:#43A047:#9CCC65><bold>✔ TOOL ACTIVE</bold></gradient>"
      lore:
        - "<gray>Equipped for</gray>  <white>{world}</white>"
        - ""
        - "<#FFD54F>Click to store it safely.</#FFD54F>"
    inactive:
      material: RED_STAINED_GLASS_PANE
      display-name: "<gradient:#E53935:#FF7043><bold>✘ TOOL STORED</bold></gradient>"
      lore:
        - "<gray>Stored for</gray>  <white>{world}</white>"
        - ""
        - "<#9CCC65>Click to equip it.</#9CCC65>"

# Default lore for physical PlexonTools items. A per-level lore list in
# tools.yml overrides this template. Reorder, add, or remove any template row.
# An empty quoted string creates a blank lore line; enabled: false removes the
# global lore from levels that do not define an override.
#
# Identity placeholders:
#   {tool} {tool_id} {level_name} {uuid} {material} {material_name}
#   {enchantments} {enchantment_count}
#   {category} {category_name} {owner_name} {owner_uuid} {bound_world}
# Progress placeholders:
#   {level} {max_level} {next_level} {current} {required} {remaining}
#   {percentage} {total} {progress_bar} {tracking} {target_progress}
#   {current_color} {percentage_color}
# Requirement placeholders (inside requirement rows):
#   {requirement_action} {requirement_target} {requirement_goal}
#   {requirement_current} {requirement_required} {requirement_remaining}
#   {requirement_percentage} {requirement_current_color}
# Enchantment placeholders (inside enchantment rows):
#   {enchantment_key} {enchantment_name} {enchantment_level}
#   {enchantment_level_roman}
#
# {requirement_lines} is special: GENERAL expands to one row, SPECIFIC expands
# once per target, and a maximum-level profile uses maximum-line.
# {enchantment_lines} expands to one compact row per active enchantment.
tool-lore:
  enabled: true
  template:
    - "<!italic><gradient:#FFF176:#FFB300><bold>✦ ANCIENT RELIC ✦</bold></gradient>"
    - "<!italic><dark_gray>┌──────────────────────────────┐</dark_gray>"
    - "<!italic><dark_gray>│</dark_gray> <#FFD740>✥</#FFD740> <gray>Rank</gray> <white><bold>Level {level}</bold></white><dark_gray> / {max_level}</dark_gray>"
    - "<!italic><dark_gray>│</dark_gray> <#90CAF9>⚒</#90CAF9> <gray>Form</gray> <white>{material_name}</white>"
    - "<!italic><dark_gray>├─</dark_gray> <gradient:#CE93D8:#AB47BC><bold>✧ ENCHANTMENTS</bold></gradient>"
    - "{enchantment_lines}"
    - "<!italic><dark_gray>├─</dark_gray> <gradient:#FFE082:#FFB300><bold>🎯 OBJECTIVES</bold></gradient>"
    - "{requirement_lines}"
    - "<!italic><dark_gray>├─</dark_gray> <#66BB6A><bold>▰ MASTERY</bold></#66BB6A> <color:{percentage_color}>{percentage}%</color>"
    - "<!italic><dark_gray>│</dark_gray> {progress_bar}"
    - "<!italic><dark_gray>└──────────────────────────────┘</dark_gray>"
    - "<!italic><#FFD54F>♟</#FFD54F> <dark_gray>Soulbound</dark_gray> <#FFB300>•</#FFB300> <white>{owner_name}</white>"

  enchantments:
    line: "<!italic><dark_gray>│</dark_gray> <#AB47BC>✦</#AB47BC> <gray>{enchantment_name}</gray> <#E1BEE7>{enchantment_level_roman}</#E1BEE7>"
    empty-line: "<!italic><dark_gray>│</dark_gray> <dark_gray>No enchantments awakened</dark_gray>"

  requirements:
    general-line: "<!italic><dark_gray>│</dark_gray> <#FFB300>◆</#FFB300> <gray>{requirement_goal}</gray> <color:{requirement_current_color}>{requirement_current}</color><dark_gray>/</dark_gray><#B0BEC5>{requirement_required}</#B0BEC5>"
    specific-line: "<!italic><dark_gray>│</dark_gray> <#FFB300>◆</#FFB300> <gray>{requirement_target}</gray> <color:{requirement_current_color}>{requirement_current}</color><dark_gray>/</dark_gray><#B0BEC5>{requirement_required}</#B0BEC5> <color:{requirement_current_color}>({requirement_percentage}%)</color>"
    maximum-line: "<!italic><dark_gray>│</dark_gray> <#AEEA00>✦</#AEEA00> <gradient:#8BC34A:#DCEDC8><bold>FULLY MASTERED</bold></gradient>"

# Legacy category showcase routes: /pt <category> and /pt all.
showcase:
  title: "<gradient:#FFF176:#FF8F00><bold>Tool Armory</bold></gradient>"
  category-title: "<gradient:#FFF176:#FF8F00><bold>Tool Categories</bold></gradient>"
  show-world-locked-tools: true
  # Clamped from 3 through 6.
  rows: 6

# Administrative /pt gui title.
admin-gui:
  title: "<gradient:#FFF176:#FF8F00><bold>Tool Manager</bold></gradient>"

# Player feedback. Sound accepts a Bukkit/Namespaced sound key.
effects:
  level-up-sound: "ENTITY_PLAYER_LEVELUP"
  level-up-particles: true
  # Displays the newest messages.progress-update during each visual refresh window.
  progress-action-bar: true
