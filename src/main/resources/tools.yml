# Tool definitions and complete per-level profiles
#
# Tool IDs are the keys under tools and may contain lowercase letters, numbers,
# underscores, or hyphens. display_name and every lore entry support MiniMessage.
#
# Root fields:
#   enabled: include the definition in gameplay/menus
#   category: ID from categories.yml
#   display_name: fallback name before level overrides are resolved
#   base_material: any Bukkit item Material
#   allowed_worlds: exact Bukkit world names (case-insensitive at runtime)
#   lore: optional per-tool default; otherwise config.yml tool-lore.template is used
#
# tracking.type options:
#   BLOCKS_BROKEN, MOBS_KILLED, ITEMS_FARMED, FISH_CAUGHT,
#   DAMAGE_DEALT, BLOCKS_PLACED
# tracking.mode options:
#   GENERAL  = one shared amount (`amount` / per-level `requirement`)
#   SPECIFIC = every target quota must complete (`targets` / `requirements`)
# Target names depend on the tracker: block/item Material names for block,
# farming, fishing, and placement trackers; living EntityType names for mob and
# damage trackers. Names are normalized to uppercase with underscores.
#
# Level fields are complete profile states unless marked as inherited:
#   requirement_mode, requirement, requirements
#   display_name (inherits), material or material_upgrade (inherits)
#   enchantments, abilities, item, lore
# A per-level lore list overrides the tool/global template; use [] for no lore.
# Progress resets on every level boundary and never carries into the next level.
#
# Ability keys:
#   AUTO_SMELT, AREA_MINE_3X3, EXP_BOOSTER, MOB_POTION_EFFECT, MAGNET
# AUTO_SMELT / AREA_MINE_3X3 / MAGNET accept `enabled: true|false`.
# EXP_BOOSTER accepts `multiplier` from 1.0 through 100.0.
# MOB_POTION_EFFECT accepts:
#   effect: Bukkit namespaced effect, such as minecraft:haste
#   level: 1–256
#   duration_ticks: 1–72000
#   target: HOLDER | TARGET
# The legacy list form (`abilities: [AUTO_SMELT, MAGNET]`) is also accepted.
# Item keys:
#   glint: AUTO | ON | OFF
#   custom_model_data: non-negative integer or omit
# Enchantment keys use Bukkit names (for example EFFICIENCY: 3). Enchantments,
# abilities, glint, model data, and lore are complete states for that level;
# display name and material inherit the most recent preceding override.
# Legacy unbreakable/hide flags remain readable, but 3.5+ protection is permanent.
#
# Bundled example: Legendary Pickaxe, complete levels 1–100.
# Level 100 is terminal, so its requirements are intentionally empty.
# Material milestones: 1 Wooden, 10 Stone, 25 Iron, 50 Diamond, 75 Netherite.
